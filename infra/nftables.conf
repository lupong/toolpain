#!/usr/sbin/nft -f
# Host firewall for ToolPain scanner VMs.
# - Drop forward from docker bridges to the internet
# - Block link-local cloud metadata
# - During build, host egress only to control plane + GitHub + npm + PyPI

flush ruleset

table inet toolpain {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    iif lo accept
    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept
    # No inbound from public internet for scan services
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    # Internal docker networks may talk among themselves; never forward out
    ct state established,related accept
  }

  chain output {
    type filter hook output priority 0; policy accept;
    # Block cloud metadata
    ip daddr 169.254.169.254 drop
    ip6 daddr fe80::/10 udp dport 546 drop
  }
}
