[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolpain"
version = "0.1.0"
description = "Security scanner for AI agent MCP tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "httpx>=0.27.0",
  "mcp>=1.0.0",
  "openai>=1.50.0",
  "dnslib>=0.9.25",
  "python-multipart>=0.0.12",
  "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.0",
  "ruff>=0.7.0",
  "httpx>=0.27.0",
]

[project.scripts]
toolpain = "control_plane.main:main"
toolpain-runner = "runner.main:main"
toolpain-sinkhole = "sandbox.sinkhole.server:main"

[tool.hatch.build.targets.wheel]
packages = ["control_plane", "runner", "sandbox"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "docker: requires Docker daemon",
  "smoke: browser smoke tests (Playwright)",
]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
